
name: Bug Report
description: Report an issue with ggforestplotR
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug!
        Please provide a reproducible example if possible.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What went wrong?
      placeholder: Provide a clear description of the issue.
    validations:
      required: true

  - type: textarea
    id: reproducible-example
    attributes:
      label: Reproducible example
      description: Provide the R code needed to reproduce the issue.
      render: r
    validations:
      required: false

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: session-info
    attributes:
      label: Session information
      description: Paste the output of sessionInfo().
      render: text
    validations:
      required: false
